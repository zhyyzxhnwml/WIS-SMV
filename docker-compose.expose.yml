# ═══════════════════════════════════════════════════════════════
# 对外发布 override —— HTTPS 入口 + 「只开一扇门」
#
#   用法（.env 里加一行，之后原来的命令照旧）:
#     COMPOSE_FILE=docker-compose.yml:docker-compose.expose.yml
#     docker compose up -d
#
#   拓扑:
#     外网 ──► web(caddy 80/443，HTTPS 在这里终止) ──► app:5000 ──► postgres/milvus/ollama
#     app / postgres / milvus / ollama 一律只绑 127.0.0.1，外部连不进来。
#
#   为什么不靠防火墙挡这些端口？
#     Docker 发布的端口走 iptables 的 DOCKER / DOCKER-USER 链，ufw 的 INPUT 规则
#     管不到它 —— `ufw deny 5432` 挡不住 docker 发布的 5432。所以必须在「发布」
#     这一层就绑回环。
#
#   ⚠ ports 必须用 !override：compose 对 ports 按唯一键 {ip,target,published,protocol}
#     合并，默认追加会让 "5432:5432"（0.0.0.0）和 "127.0.0.1:5432:5432" 两条并存，
#     库照样暴露。!override 需 Docker Compose ≥ v2.24.4。
#
#   端口:
#     HTTPS 标准端口 443（HTTPS_PORT 可改，例如 443 被占时用 477）；
#     80 必须留给 Caddy —— Let's Encrypt 的 http-01 校验和 http→https 跳转都靠它。
#     证书签发/续期配置见 docker/Caddyfile。
# ═══════════════════════════════════════════════════════════════
services:
  # 唯一对外入口：HTTPS 终止 + 反代到 app
  web:
    image: caddy:2-alpine
    container_name: ais-web
    ports: !override
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # caddy_data 必须挂卷：证书和私钥在里面，否则容器一重建就重新申请（会撞
      # Let's Encrypt 的签发频率限制）
      - caddy_data:/data
      - caddy_config:/config
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # ── 公网 HTTPS 入口（Cloudflare 快速隧道）─────────────────────────────
  # 给「别人什么都不用装、点开网址就能用」的场景：cloudflared 主动往外连，
  # 换回一个 https://xxxx.trycloudflare.com，证书在 Cloudflare 边缘，浏览器天然信任。
  #   - 不需要公网 IP、不需要备案、不需要在服务器上开任何端口；
  #   - 换回来的那个 URL 在日志里: docker compose logs tunnel | grep trycloudflare
  #   - 重启容器会换新 URL（要固定 URL 就得买域名 + 命名隧道）
  #   - URL 泄露给谁，谁就能打开 —— 开之前务必先把管理员密码改强
  # 不想要它：把这整段删掉再 up -d。
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ais-tunnel
    command: tunnel --no-autoupdate --url http://app:5000
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # Web 本体只对本机可见（Caddy 走 compose 内网，用服务名 app:5000）
  app:
    ports: !override
      - "127.0.0.1:${APP_HOST_PORT:-5000}:5000"

  # 以下三个同样只绑回环：宿主机上的 psql / curl / 调试脚本照旧可用，外部连不上
  postgres:
    ports: !override
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"

  milvus:
    ports: !override
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"

  ollama:
    ports: !override
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    # 这台服务器没有 GPU，必须去掉基础文件里的显卡直通（保留会起不来：
    # could not select device driver "nvidia" with capabilities: [[gpu]]）。
    # 只清 devices 这一项，deploy 下其它内容照旧合并。
    # 以后换到有 GPU 的机器，把这段删掉即可。
    # 放在这里是为了不用手改 docker-compose.yml —— 手改会和 git pull 冲突。
    deploy:
      resources:
        reservations:
          devices: !reset []

volumes:
  caddy_data:
  caddy_config:
